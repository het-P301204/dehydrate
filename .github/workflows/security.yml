name: Security

on:
  schedule:
    # Run every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Dependency Audit ──────────────────────────────────────
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Frontend npm audit
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: npm audit (frontend)
        run: cd frontend && npm audit --audit-level=high || true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install safety
        run: pip install safety

      - name: Safety check (backend)
        run: safety check -r backend/requirements.txt || true

      - name: Safety check (all labs)
        run: |
          for req in labs/*/requirements.txt; do
            echo "=== $req ==="
            safety check -r "$req" || true
          done

  # ── Container Image Scan ──────────────────────────────────
  container-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images for scanning
        run: |
          docker compose build python-pickle-lab callback-simulator

      - name: Scan python-pickle-lab
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'serial-python-pickle-lab'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

      - name: Scan callback-simulator
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'serial-callback-simulator'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

  # ── SAST ──────────────────────────────────────────────────
  sast:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bandit + semgrep
        run: pip install bandit semgrep

      - name: Bandit (backend)
        run: bandit -r backend/ -f json -o bandit-report.json || true

      - name: Bandit (labs)
        run: bandit -r labs/ -f json -o bandit-labs-report.json || true

      - name: Semgrep scan
        run: semgrep --config=auto backend/ labs/ --json > semgrep-report.json || true

      - name: Upload SAST reports
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports
          path: |
            bandit-report.json
            bandit-labs-report.json
            semgrep-report.json
          retention-days: 30

  # ── Secrets Scan ──────────────────────────────────────────
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
        continue-on-error: true
